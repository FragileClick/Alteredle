services:
    alteredle_dev:
        container_name: alteredle_dev
        ports:
        - 5051:5000
        volumes:
        - ./db.sqlite:/python-docker/db.sqlite
        environment:
        - ALTEREDLE_CLIENT_SECRET=${ALTEREDLE_CLIENT_SECRET}
        build:
            context: .
            dockerfile: ./Dockerfile
            no_cache: true
        restart: unless-stopped
    alteredle:
        container_name: alteredle_prd
        ports:
        - 5050:5000
        volumes:
        - ./db.sqlite:/python-docker/db.sqlite
        environment:
        - ALTEREDLE_CLIENT_SECRET=${ALTEREDLE_CLIENT_SECRET}
        build:
            context: .
            dockerfile: ./Dockerfile
            no_cache: true
        restart: unless-stopped 
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <!-- Title & Style -->
  <title>Alteredle</title>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Icons -->
  <link rel="icon" href="assets/icon.svg" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="stylesheet" href="assets/alteredicons.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alteredle">
  <meta name="theme-color" content="#f5f5f1">
  <!-- Link embed summary -->
  <meta property="og:title" content="Alteredle">
  <meta property="og:description" content="Card guessing game for Altered TCG. Jeu de devinettes de cartes pour Altered TCG.">
  <meta property="og:url" content="https://fragileclick.github.io/Alteredle">
  <meta property="og:image" content="https://fragileclick.github.io/Alteredle/docs/banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Report -->
  <script src="https://cloud.umami.is/script.js" data-website-id="9b839b1e-deb3-499e-bdee-0bb36518a197"></script>
</head>
<body>
  <header>
    <div class="header-content">
      <h1 class="title"><span class="title1">Altered</span><span class="title2">le</span></h1>
      <button id="language_toggle" onclick="toggleLanguage()">
        <span id="language_toggle_fr">🇫🇷</span>
        <span> / </span>
        <span id="language_toggle_en">🇬🇧</span>
      </button>
    </div>
  </header>
  <div id="game">
    <img class="banner-img" src="https://cdn.alteredcore.org/illustrations_hd/CORE/ALT_CORE_B_OR_09_C_FRAMELESS_T1.jpg">
    <h1 id="hero_text_title"><span id="hero_text" class="title1"></span><span class="title2">Altered TCG</span></h1>
    <div class="player-input">
      <input id="game_search_input" type="text" oninput="player_search(self)">
      <ul id="game_search_autocomplete" class="player-input-autocomplete hidden"></ul>
      <div id="countdown" class="hidden">
        <p id="countdown_title"></p>
        <h1 id="countdown_timer">0h 0m 0s</h1>
      </div>
    </div>
    <div id="game_board" class="game-board">
    </div>
    <div><a id="player_hint" class="altered_button" href="https://github.com/FragileClick/Alteredle#card-list"></a></div>
    <div id="game_result" class="game_result hidden">
      <h1 id="result_title" class="title1"></h1>
      <p id="result_subtitle"></p>
      <div id="result_card_container" onPointerEnter="cardAnimationStart(event)" onPointerMove="cardAnimationMove(event)" onPointerLeave="cardAnimationStop(event)">
        <img id="result_card_foil_overlay" src="assets/foil.webp" draggable="false" class="hidden">
        <img id="game_result_img" src="assets/cardback.webp" draggable="false">
        <div id="result_card_specular_overlay"></div>
      </div>
    </div>  
    <button id="share_button" class="altered_button hidden"><p id="share_button_text" class="altered_button_text"></p></button>
  </div>
  <footer>
    <div class="header-content">
      <p><b><span class="title1">ALTERED</span><span class="title2">LE</span></b> <span
          id="footer_attribution_article"></span> <a href="https://github.com/FragileClick/Alteredle" target="_blank" rel="noopener noreferrer">FragileClick</a></p>
      <img src="https://cdn.alteredcore.org/marketing/fan_content/LOGO_ALTERED_BLACK_WATERMARK.png" class="watermark">
    </div>
  </footer>
</body>
<script type="text/javascript" src="js/fuse.js"></script>
<script type="text/javascript" src="js/lib.js"></script>
<script type="text/javascript" src="js/db.js"></script>
<script type="text/javascript" src="js/countdown.js"></script>
<script type="text/javascript" src="js/cardanimation.js"></script>
<script type="text/javascript" src="js/main.js"></script>
</html>
